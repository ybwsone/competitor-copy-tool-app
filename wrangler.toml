name = "competitor-copy-tool-app"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# 静态前端资源目录
[assets]
directory = "./public"
binding = "ASSETS"

# KV 命名空间，用于存储竞品分析和产品资料
# 部署前需要先执行：npx wrangler kv namespace create LIBRARY_KV
# 然后把生成的 id 填到下面
[[kv_namespaces]]
binding = "LIBRARY_KV"
id = "77f922838987452599bafb604433af7f"

# 环境变量通过 secret 设置，不写在这里：
# npx wrangler secret put ANTHROPIC_API_KEY
# npx wrangler secret put TEAM_PASSCODE
